# ==============================================================================
# Primary DNS Resolver Configuration (Mac B - 10.7.18.87)
# Service: dnsmasq
# Role: Authoritative & Forwarding DNS for domain 'my_team.test'
# ==============================================================================

# Network Binding
# Listen on standard DNS port 53 across all interfaces or specified LAN IP
port=53
listen-address=127.0.0.1,10.7.18.87
bind-interfaces

# Do not forward plain names (without a dot or domain part)
domain-needed

# Do not forward addresses in the non-routed address spaces
bogus-priv

# Upstream public DNS servers for external resolution
server=8.8.8.8
server=1.1.1.1

# Define local domain namespace
local=/my_team.test/
domain=my_team.test

# Authoritative A Records for my_team.test
# Final intended configuration post-migration:
# app.my_team.test resolves to Standby Nginx Edge on Mac B (10.7.18.87)
# api.my_team.test resolves to Original Nginx Edge on Mac A (10.7.5.56)
address=/app.my_team.test/10.7.18.87
address=/api.my_team.test/10.7.5.56

# Base domain record
address=/my_team.test/10.7.18.87

# Cache and TTL Settings
# Set DNS Time-To-Live (TTL) to 30 seconds for migration testing
local-ttl=30
min-cache-ttl=30
max-cache-ttl=30

# Logging for verification & debugging
log-queries
log-facility=/tmp/dnsmasq-primary.log
