# ==============================================================================
# Backup DNS Resolver Configuration (Mac A - 10.7.5.56)
# Service: dnsmasq
# Role: Redundant / Secondary DNS for domain 'my_team.test'
# ==============================================================================

# Network Binding
# Listen on standard DNS port 53 across loopback and Mac A LAN IP
port=53
listen-address=127.0.0.1,10.7.5.56
bind-interfaces

# Do not forward plain un-dotted names
domain-needed

# Do not forward private reverse lookups
bogus-priv

# Upstream public DNS forwarders
server=8.8.8.8
server=1.1.1.1

# Define local domain namespace
local=/my_team.test/
domain=my_team.test

# Authoritative A Records for my_team.test (Mirrors Primary Configuration)
address=/app.my_team.test/10.7.18.87
address=/api.my_team.test/10.7.5.56

# Base domain record
address=/my_team.test/10.7.18.87

# Cache and TTL Settings
local-ttl=30
min-cache-ttl=30
max-cache-ttl=30

# Logging for verification & debugging
log-queries
log-facility=/tmp/dnsmasq-backup.log
