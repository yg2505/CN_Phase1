# ==============================================================================
# Standby Nginx Edge Configuration (Mac B - 10.7.18.87)
# Service: nginx
# Role: Standby Edge Reverse Proxy (app.my_team.test post-cutover)
# Listening Port: 8081
# Proxies to: Mac A backends over LAN (10.7.5.56:3001 and 10.7.5.56:3002)
# ==============================================================================

events {
    worker_connections 1024;
}

http {
    # Logging configuration
    access_log /tmp/nginx-mac-b-access.log;
    error_log  /tmp/nginx-mac-b-error.log info;

    # Upstream backend pool pointing to physical host Mac A across LAN
    upstream mac_a_remote_backends {
        # Passive health checking: mark down for 10s if 1 request fails
        server 10.7.5.56:3001 max_fails=1 fail_timeout=10s;
        server 10.7.5.56:3002 max_fails=1 fail_timeout=10s;
    }

    server {
        listen 8081;
        server_name app.my_team.test 10.7.18.87 localhost;

        # Forward original client headers across the LAN proxy hop
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Seamless passive failover to surviving upstream
        proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
        proxy_send_timeout 5s;

        # Edge identification header
        add_header X-Proxy-Edge "Mac-B-Standby" always;

        location / {
            proxy_pass http://mac_a_remote_backends;
        }

        location /api/status {
            proxy_pass http://mac_a_remote_backends;
        }
    }
}
