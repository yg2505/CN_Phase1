# ==============================================================================
# Original Nginx Edge Configuration (Mac A - 10.7.5.56)
# Service: nginx
# Role: Reverse Proxy & Load Balancer (api.my_team.test & original edge)
# Listening Port: 8081
# ==============================================================================

events {
    worker_connections 1024;
}

http {
    # Logging configuration
    access_log /tmp/nginx-mac-a-access.log;
    error_log  /tmp/nginx-mac-a-error.log info;

    # Upstream backend pool on Mac A (Local Loopback)
    upstream mac_a_backends {
        # Round-robin scheduling with passive health monitoring
        server 127.0.0.1:3001 max_fails=1 fail_timeout=10s;
        server 127.0.0.1:3002 max_fails=1 fail_timeout=10s;
    }

    server {
        listen 8081;
        server_name api.my_team.test app.my_team.test 10.7.5.56 localhost;

        # Client header forwarding
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Transparent backend failover configuration
        proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
        proxy_send_timeout 5s;

        # Response identification headers
        add_header X-Proxy-Edge "Mac-A-Original" always;

        location / {
            proxy_pass http://mac_a_backends;
        }

        location /api/status {
            proxy_pass http://mac_a_backends;
        }
    }
}
