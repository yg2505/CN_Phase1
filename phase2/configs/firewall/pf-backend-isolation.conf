# ==============================================================================
# macOS Packet Filter (PF) Service Isolation Rules
# Anchor: com.local.backend-isolation
# Host: Mac A (10.7.5.56)
# Target Ports: 3001 (Backend A), 3002 (Backend B)
# ==============================================================================

# Rule 1: Allow unrestricted local loopback traffic
# Allows local Nginx on Mac A (127.0.0.1) to reach the backends
pass in quick on lo0 proto tcp from any to any port {3001, 3002}

# Rule 2 (Optional Whitelist): Allow reverse proxy on Mac B (10.7.18.87)
# When testing cross-host edge proxying while blocking generic LAN hosts:
# pass in quick proto tcp from 10.7.18.87 to any port {3001, 3002}

# Rule 3: Block all incoming TCP connections to backend ports from LAN
# Returns TCP RST (connection refused) rather than silently dropping,
# providing deterministic rejection evidence.
block return in log proto tcp from any to any port {3001, 3002}
